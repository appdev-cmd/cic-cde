[workspace]
members = ["crates/application", "crates/host", "crates/mcp", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
qabim-application = { path = "crates/application" }
qabim-host = { path = "crates/host" }
