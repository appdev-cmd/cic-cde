name: P0 regression gate
on:
  pull_request:
  push:
    branches: [main, 'codex/p0-*']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e './workers/bim[test]'
      - run: pnpm build
      - run: pnpm test:worker
      - run: pnpm test:geometry
      - run: node --experimental-strip-types scripts/verify_revision_display.mjs
      - run: cargo test -p qabim-application --locked
      - run: cargo build -p qabim-host --bin qabim-local --locked
      - run: python scripts/verify_security.py
