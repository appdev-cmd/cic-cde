# Enable after installing a certificate for cde.cic.com.vn.
# The ciccde_web upstream is declared by nginx-edge-http.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cde.cic.com.vn;

    ssl_certificate /etc/letsencrypt/live/cde.cic.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cde.cic.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location = / {
        if ($args = "") {
            return 302 https://cde.cic.com.vn/?cde=1;
        }
        proxy_pass http://ciccde_web;
        proxy_set_header Host cde.cic.com.vn;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://ciccde_web;
        proxy_http_version 1.1;
        proxy_set_header Host cde.cic.com.vn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_cookie_flags ciccde_session secure httponly samesite=strict;
    }
}
