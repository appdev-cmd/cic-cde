map $http_host $ciccde_allowed_host {
    default 0;
    "127.0.0.1:18420" 1;
    "cde.cic.com.vn" 1;
}

map $http_host $ciccde_cookie_security {
    default nosecure;
    "cde.cic.com.vn" secure;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 100m;

    if ($ciccde_allowed_host = 0) { return 421; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://api:4318/;
        proxy_cookie_flags ciccde_session $ciccde_cookie_security httponly samesite=strict;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 150s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
