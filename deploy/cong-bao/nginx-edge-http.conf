# Included inside the existing ingress nginx http block.
upstream ciccde_web {
    zone ciccde_web 64k;
    server ciccde-web:8080 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name cde.cic.com.vn;
    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # The external gateway must set this header when terminating TLS.
    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://cde.cic.com.vn$request_uri;
        }
        if ($request_uri = "/") {
            return 302 https://cde.cic.com.vn/?cde=1;
        }
        proxy_pass http://ciccde_web;
        proxy_http_version 1.1;
        proxy_set_header Host cde.cic.com.vn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_cookie_flags ciccde_session secure httponly samesite=strict;
    }
}
